<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin - SM Equipment Monitoring</title>
  <meta name="description" content="Manage equipment and generate QR codes">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body>
  <header>
    <div class="header-title">SM Equipment Monitoring</div>
    <div class="header-sub">Admin Panel <span id="mockBadge" class="hidden" style="display:none">(mock)</span></div>
  </header>

  <main>
    <div id="errorMsg" class="error-msg" role="alert"></div>

    <!-- Login -->
    <section id="loginSection" class="section active" aria-label="Admin login">
      <div class="login-card card">
        <div class="login-icon"><i data-lucide="shield"></i></div>
        <h1>Admin Access</h1>
        <p>Enter the admin password to manage equipment and generate QR codes.</p>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter admin password">
        </div>
        <button class="btn btn-primary" id="loginBtn">
          <i data-lucide="arrow-right"></i> Sign In
        </button>
      </div>
    </section>

    <!-- Admin -->
    <section id="adminSection" class="section" aria-label="Equipment management">
      <div class="admin-header">
        <h1>Equipment</h1>
        <button class="btn btn-primary btn-sm no-print" id="showAddBtn">
          <i data-lucide="plus"></i> New
        </button>
      </div>

      <!-- Add Form -->
      <div id="addForm" class="card hidden">
        <div class="card-header">
          <i data-lucide="package"></i>
          <h2>Add Equipment</h2>
        </div>
        <div class="card-body">
          <div class="field">
            <label for="eqName">Equipment Name</label>
            <input type="text" id="eqName" placeholder="e.g. Cordless Drill" autocomplete="off">
          </div>
          <div class="field">
            <label for="eqType">Type</label>
            <input type="text" id="eqType" placeholder="e.g. Power Tool (optional)" autocomplete="off">
          </div>
          <div class="field">
            <label for="eqDesc">Description</label>
            <input type="text" id="eqDesc" placeholder="e.g. 18V Makita (optional)" autocomplete="off">
          </div>
          <div class="field">
            <label for="eqStock">Stock</label>
            <input type="number" id="eqStock" placeholder="e.g. 5" min="0" autocomplete="off">
          </div>
        </div>
        <div class="card-footer">
          <div class="btn-row">
            <button class="btn btn-success" id="saveEqBtn">
              <i data-lucide="check"></i> Save
            </button>
            <button class="btn btn-ghost" id="cancelAddBtn">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Equipment List -->
      <div id="equipmentContainer"><div class="loading"><div class="spinner"></div><span>Loading equipment...</span></div></div>

      <!-- QR Actions -->
      <div class="btn-group no-print">
        <button class="btn btn-outline" id="showQrBtn">
          <i data-lucide="qr-code"></i> Show All QR Codes
        </button>
        <button class="btn btn-ghost" id="printQrBtn">
          <i data-lucide="printer"></i> Print QR Sheet
        </button>
      </div>

      <div id="qrSection" class="hidden">
        <hr style="border:none;border-top:1px solid var(--border-light);margin:var(--space-5) 0">
        <h2>QR Codes for Printing</h2>
        <p>Cut and attach these to each equipment item.</p>
        <div id="qrGrid" class="qr-grid"></div>
      </div>

      <div class="link-group no-print">
        <a href="index.html" class="link-btn">
          <i data-lucide="arrow-left"></i> Back to Borrow Page
        </a>
      </div>
    </section>
  </main>

  <script>lucide.createIcons()</script>
  <script src="js/admin.js"></script>
</body>
</html>
