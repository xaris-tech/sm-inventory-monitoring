<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment QR Sheet</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <style>
    .sheet-meta {
      margin-bottom: var(--space-4);
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    .qr-grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    .qr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3);
    }

    .qr-item strong {
      font-size: 0.8125rem;
      line-height: 1.3;
      text-align: center;
    }

    .qr-item .meta {
      font-size: 0.6875rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    @media print {
      header, .no-print {
        display: none !important;
      }

      body {
        background: white;
      }

      main {
        max-width: none;
      }

      .qr-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .qr-item {
        border: 1px dashed #ccc;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">SM Equipment Monitoring</div>
    <div class="header-sub">Equipment QR Sheet</div>
  </header>

  <main>
    <h1>Equipment QR Codes</h1>
    <p class="sheet-meta" id="sheetMeta">Each QR encodes only the equipment ID. Print this sheet, cut the codes, and attach them to items.</p>

    <div id="qrGrid" class="qr-grid"></div>

    <div class="btn-group no-print" style="margin-top: var(--space-5)">
      <button class="btn btn-primary" id="printBtn">
        <i data-lucide="printer"></i> Print QR Sheet
      </button>
      <a href="admin.html" class="btn btn-outline" style="text-decoration:none;text-align:center">
        <i data-lucide="arrow-left"></i> Back to Admin
      </a>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    const grid = document.getElementById('qrGrid')
    const sheetMeta = document.getElementById('sheetMeta')
    function escapeHtml(str) {
      const div = document.createElement('div')
      div.textContent = str
      return div.innerHTML
    }

    function renderEquipment(items, sourceLabel) {
      grid.innerHTML = ''
      sheetMeta.textContent = `Showing ${items.length} equipment item(s) from ${sourceLabel}. Each QR encodes only the equipment ID.`

      items.forEach(eq => {
        const item = document.createElement('div')
        item.className = 'qr-item'

        const qrDiv = document.createElement('div')
        const name = document.createElement('strong')
        name.innerHTML = escapeHtml(eq.item_name)

        const meta = document.createElement('div')
        meta.className = 'meta'
        meta.textContent = eq.item_id

        item.appendChild(qrDiv)
        item.appendChild(name)
        item.appendChild(meta)
        grid.appendChild(item)

        new QRCode(qrDiv, { text: eq.item_id, width: 140, height: 140 })
      })
    }

    async function loadLiveEquipment() {
      const url = `${CONFIG.API_URL}?action=getEquipment`
      const res = await fetch(url, { method: 'GET' })
      const data = await res.json()
      if (!data.equipment || !data.equipment.length) throw new Error('No equipment returned')
      renderEquipment(data.equipment, 'live Equipment sheet')
    }

    document.getElementById('printBtn').addEventListener('click', () => window.print())

    loadLiveEquipment().catch(() => {
      grid.innerHTML = ''
      sheetMeta.textContent = 'Could not load live equipment. Redeploy Apps Script, then refresh this page.'
    }).finally(() => {
      lucide.createIcons()
    })
  </script>
</body>
</html>
