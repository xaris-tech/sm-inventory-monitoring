<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment QR Sheet</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <style>
    .sheet-meta {
      margin-bottom: var(--space-4);
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    .qr-grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }

    .qr-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3);
    }

    .qr-item strong {
      font-size: 0.8125rem;
      line-height: 1.3;
      text-align: center;
    }

    .qr-item .meta {
      font-size: 0.6875rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    @media print {
      header, .no-print {
        display: none !important;
      }

      body {
        background: white;
      }

      main {
        max-width: none;
      }

      .qr-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      .qr-item {
        border: 1px dashed #ccc;
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">SM Equipment Monitoring</div>
    <div class="header-sub">Equipment QR Sheet</div>
  </header>

  <main>
    <h1>Equipment QR Codes</h1>
    <p class="sheet-meta">Each QR encodes only the equipment ID. Print this sheet, cut the codes, and attach them to items.</p>

    <div id="qrGrid" class="qr-grid"></div>

    <div class="btn-group no-print" style="margin-top: var(--space-5)">
      <button class="btn btn-primary" id="printBtn">
        <i data-lucide="printer"></i> Print QR Sheet
      </button>
      <a href="admin.html" class="btn btn-outline" style="text-decoration:none;text-align:center">
        <i data-lucide="arrow-left"></i> Back to Admin
      </a>
    </div>
  </main>

  <script>
    const EQUIPMENT = [
      { item_id: 'EQ-001', item_name: 'Tool Box' },
      { item_id: 'EQ-002', item_name: 'Tape Measure' },
      { item_id: 'EQ-003', item_name: 'Gun tacker' },
      { item_id: 'EQ-004', item_name: 'Gun tack staple' },
      { item_id: 'EQ-005', item_name: 'Pardible' },
      { item_id: 'EQ-006', item_name: 'Thumb tacks' },
      { item_id: 'EQ-007', item_name: 'Zip Ties' },
      { item_id: 'EQ-008', item_name: 'Rubber Bands' },
      { item_id: 'EQ-009', item_name: 'Instant Glue' },
      { item_id: 'EQ-010', item_name: 'No more nails' },
      { item_id: 'EQ-011', item_name: 'Masking tape' },
      { item_id: 'EQ-012', item_name: 'Duct tape' },
      { item_id: 'EQ-013', item_name: 'Caution tape' },
      { item_id: 'EQ-014', item_name: 'Double-sided tape' },
      { item_id: 'EQ-015', item_name: 'Electrical Tape' },
      { item_id: 'EQ-016', item_name: 'Mini Hot Glue gun' },
      { item_id: 'EQ-017', item_name: 'Hot Glue stick' },
      { item_id: 'EQ-018', item_name: 'Scissors' },
      { item_id: 'EQ-019', item_name: 'Cutter Blade' },
      { item_id: 'EQ-020', item_name: 'Cutter' },
      { item_id: 'EQ-021', item_name: 'Combination Pliers' },
      { item_id: 'EQ-022', item_name: 'Screw Driver' },
      { item_id: 'EQ-023', item_name: 'Hammer' },
      { item_id: 'EQ-024', item_name: 'Post it Tabs' },
      { item_id: 'EQ-025', item_name: 'Glow tape' },
      { item_id: 'EQ-026', item_name: 'Ball Pen' },
      { item_id: 'EQ-027', item_name: 'Permanent Marker' },
      { item_id: 'EQ-028', item_name: 'White board marker' },
      { item_id: 'EQ-029', item_name: 'White Flower' },
      { item_id: 'EQ-030', item_name: 'Black Tray' },
      { item_id: 'EQ-031', item_name: 'Black Mesh Pouch' },
      { item_id: 'EQ-032', item_name: 'Tissue Box' },
      { item_id: 'EQ-033', item_name: 'Balloon Inflator' },
      { item_id: 'EQ-034', item_name: 'Blower' },
      { item_id: 'EQ-035', item_name: 'Adjustable round table' },
      { item_id: 'EQ-036', item_name: 'Clip board' },
      { item_id: 'EQ-037', item_name: 'Bond paper' },
      { item_id: 'EQ-038', item_name: 'Printer' },
      { item_id: 'EQ-039', item_name: 'White board' },
      { item_id: 'EQ-040', item_name: 'Wet Wipes' },
      { item_id: 'EQ-041', item_name: 'Alcohol' },
      { item_id: 'EQ-042', item_name: 'Disinfectant spray(Lysol)' },
      { item_id: 'EQ-043', item_name: 'Stapple wires' },
      { item_id: 'EQ-044', item_name: 'Stapler with Remover' },
      { item_id: 'EQ-045', item_name: 'Single Hole Puncher' },
    ]

    const grid = document.getElementById('qrGrid')

    EQUIPMENT.forEach(eq => {
      const item = document.createElement('div')
      item.className = 'qr-item'

      const qrDiv = document.createElement('div')
      const name = document.createElement('strong')
      name.textContent = eq.item_name

      const meta = document.createElement('div')
      meta.className = 'meta'
      meta.textContent = eq.item_id

      item.appendChild(qrDiv)
      item.appendChild(name)
      item.appendChild(meta)
      grid.appendChild(item)

      new QRCode(qrDiv, { text: eq.item_id, width: 140, height: 140 })
    })

    document.getElementById('printBtn').addEventListener('click', () => window.print())
    lucide.createIcons()
  </script>
</body>
</html>
