<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test QR Codes - SM Equipment Monitoring</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
</head>
<body>
  <header>
    <div class="header-title">SM Equipment Monitoring</div>
    <div class="header-sub">Test QR Codes</div>
  </header>

  <main>
    <p style="margin-bottom:var(--space-3)">Scan these QR codes from your phone to test the borrowing flow. Each encodes an equipment ID.</p>

    <div id="qrGrid" class="qr-grid"></div>

    <hr style="border:none;border-top:1px solid var(--border-light);margin:var(--space-5) 0">

    <div class="btn-group no-print">
      <button class="btn btn-primary" id="printBtn">
        <i data-lucide="printer"></i> Print
      </button>
      <a href="index.html" class="btn btn-outline" style="text-decoration:none;text-align:center">
        <i data-lucide="arrow-left"></i> Back to App
      </a>
    </div>
  </main>

  <script>
    const MOCK_EQUIPMENT = [
      { item_id: 'EQ-001', item_name: 'Cordless Drill' },
      { item_id: 'EQ-002', item_name: 'Extension Ladder' },
      { item_id: 'EQ-003', item_name: 'Concrete Mixer' },
      { item_id: 'EQ-004', item_name: 'Angle Grinder' },
      { item_id: 'EQ-005', item_name: 'Circular Saw' },
      { item_id: 'EQ-006', item_name: 'Air Compressor' },
      { item_id: 'EQ-007', item_name: 'Pressure Washer' },
      { item_id: 'EQ-008', item_name: 'Electric Hoist' },
      { item_id: 'EQ-009', item_name: 'Welding Machine' },
      { item_id: 'EQ-010', item_name: 'Jackhammer' },
    ]

    const grid = document.getElementById('qrGrid')

    MOCK_EQUIPMENT.forEach(eq => {
      const item = document.createElement('div')
      item.className = 'qr-item'

      const qrDiv = document.createElement('div')
      qrDiv.style.display = 'flex'
      qrDiv.style.justifyContent = 'center'

      const label = document.createElement('label')
      label.textContent = `${eq.item_name} (${eq.item_id})`

      item.appendChild(qrDiv)
      item.appendChild(label)
      grid.appendChild(item)

      new QRCode(qrDiv, { text: eq.item_id, width: 140, height: 140 })
    })

    document.getElementById('printBtn').addEventListener('click', () => window.print())

    lucide.createIcons()
  </script>

  <style>
    @media print {
      header, .no-print, .btn-group { display: none !important; }
      body { background: white; }
      .qr-grid { grid-template-columns: repeat(4, 1fr); }
      .qr-item { border: 1px dashed #ccc; break-inside: avoid; }
    }
  </style>
</body>
</html>
